[workspace]
authors = ["Dave Barry <david.barry@crick.ac.uk>"]
channels = ["conda-forge"]
name = "flag-qc"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.7,<3.15"
pixi-pycharm = ">=0.0.12,<0.0.13"

[environments]
flagqc = ["default"]

[pypi-dependencies]
bioio = ">=3.5.1, <4"
bioio-ome-tiff = ">=1.4.0, <2"
numpy = ">=2.5.3, <3"
scipy = ">=1.18.1, <2"
jupyter = ">=1.1.1, <2"
torch = ">=2.14.0, <3"
scikit-image = ">=0.26.0, <0.27"
